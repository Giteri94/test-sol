<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Une horloge affichant l'heure locale en temps réel."><title>Heure locale</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 15%,#234e78,transparent 38%),radial-gradient(circle at 85% 80%,#3b245e,transparent 40%),#08111f;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,720px);padding:clamp(32px,8vw,72px) clamp(24px,8vw,72px);text-align:center;border:1px solid #ffffff24;border-radius:28px;background:#0f1b2ec7;box-shadow:0 24px 80px #0000005c}.eyebrow{margin:0 0 16px;color:#8ecbff;font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.55rem,4vw,2.25rem);letter-spacing:-.04em}.date{min-height:1.5em;margin:12px 0 36px;color:#aab8ca}time{display:block;font-family:monospace;font-size:clamp(3.4rem,13vw,7.6rem);font-weight:700;letter-spacing:-.08em;line-height:1;font-variant-numeric:tabular-nums}.zone{margin:28px 0 0;color:#7f91a8;font-size:.82rem}@media(max-width:420px){body{padding:16px}.card{border-radius:22px}}
